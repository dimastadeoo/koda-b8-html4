<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This document to learn how to use forms.">
    <title>Learning Use Form Input</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>

<body class="font-sans bg-pink-200">
    <main class="p-6 grid place-items-center">
        <form class="w-full justify-center grid gap-2 my-4" action="data.html" id="form">
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <div class="h-2.5 bg-pink-500 w-full">
                </div>
                <div class="p-6">
                    <h1 class="text-3xl font-normal text-gray-900 mb-3">
                        Form Survey Perokok
                    </h1>
                    <p class="text-sm text-gray-900">
                        Form ini untuk menentukan banyaknya perokok
                    </p>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <div class="p-6">
                    <label class="block text-base text-gray-900 mb-6 font-medium" for="name">
                        Siapa nama anda?
                    </label>
                    <input id="name" name="name"
                        class="w-full max-w-[80%] border-b border-gray-500 py-2 text-sm text-gray-900 outline-none "
                        type="text" placeholder="Your Answer" required />
                </div>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <div class="p-6">
                    <label class="block text-base text-gray-900 mb-6 font-medium" for="age">
                        Berapa umur anda?
                    </label>
                    <input class="w-full max-w-[80%] border-b border-gray-500 py-2 text-sm text-gray-900 outline-none"
                        id="age" name="age" type="number" placeholder="Your Answer" required>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <div class="p-6">
                    <label class="block text-base text-gray-900 mb-6 font-medium">
                        Apa jenis kelamin anda?
                    </label>
                    <div class="flex flex-col gap-4">
                        <label for="female"
                            class="w-full h-full flex items-center cursor-pointer text-sm text-gray-900 gap-2.5">

                            <input type="radio" id="female" name="gender" value="Perempuan"
                                class="w-5 h-5 accent-pink-500 cursor-pointer" />
                            <span class="text-[15px] text-gray-900">
                                Perempuan
                            </span>

                        </label>
                        <label for="man"
                            class="w-full h-full flex items-center cursor-pointer text-sm text-gray-900 gap-2.5">

                            <input type="radio" id="man" name="gender" value="Laki-laki"
                                class="w-5 h-5 accent-pink-500 cursor-pointer" />
                            <span class="text-[15px] text-gray-900">
                                Laki-laki
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <div class="p-6">
                    <label class="block text-base text-gray-900 mb-6 font-medium">
                        Apakah anda Perokok?
                    </label>
                    <div class="flex flex-col gap-4">
                        <label for="yes"
                            class="w-full h-full flex items-center cursor-pointer text-sm text-gray-900 gap-2.5">
                            <input type="radio" id="yes" name="smoke" value="Ya"
                                class="w-5 h-5 accent-pink-500 cursor-pointer" />
                            <span class="text-[15px] text-gray-900">Ya</span>
                        </label>
                        <label for="no"
                            class="w-full h-full flex items-center cursor-pointer text-sm text-gray-900 gap-2.5">
                            <input type="radio" id="no" name="smoke" value="Tidak"
                                class="w-5 h-5 accent-pink-500 cursor-pointer" />
                            <span class="text-[15px] text-gray-900">Tidak</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <div class="p-6">
                    <label class="block text-base text-gray-900 mb-6 font-medium">
                        Jika anda perokok, rokok apa yang anda
                        pernah coba?
                    </label>
                    <div class="flex flex-col gap-4">
                        <label for="gudangGaram"
                            class="w-full h-full flex items-center cursor-pointer text-sm text-gray-900 gap-2.5">
                            <input type="checkbox" id="gudangGaram" name="merkSmoke" value="Gudang Garam Filter"
                                class="w-[18px] h-[18px] accent-pink-500 rounded cursor-pointer" />
                            <span class="text-[15px] text-gray-900">Gudang Garam Filter</span>
                        </label>
                        <label for="luckyStrike"
                            class="w-full h-full flex items-center cursor-pointer text-sm text-gray-900 gap-2.5">
                            <input type="checkbox" id="luckyStrike" name="merkSmoke" value="Lucky Strike"
                                class="w-[18px] h-[18px] accent-pink-500 rounded cursor-pointer" />
                            <span class="text-[15px] text-gray-900">
                                Lucky Strike
                            </span>
                        </label>
                        <label for="marlboro"
                            class="w-full h-full flex items-center cursor-pointer text-sm text-gray-900 gap-2.5">
                            <input type="checkbox" id="marlboro" name="merkSmoke" value="Marlboro"
                                class="w-[18px] h-[18px] accent-pink-500 rounded cursor-pointer" />
                            <span class="text-[15px] text-gray-900">
                                Marlboro
                            </span>
                        </label>
                        <label for="esse"
                            class="w-full h-full flex items-center cursor-pointer text-sm text-gray-900 gap-2.5">
                            <input type="checkbox" id="esse" name="merkSmoke" value="Esse"
                                class="w-[18px] h-[18px] accent-pink-500 rounded cursor-pointer" />
                            <span class="text-[15px] text-gray-900">
                                Esse
                            </span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex justify-start items-center gap-4 mx-1 my-2">
                <div class="flex gap-3">
                    <button type="submit"
                        class="bg-pink-500 hover:bg-pink-600 text-white border-none rounded py-2.5 px-6 text-sm font-medium cursor-pointer">
                        Submit
                    </button>
                    <a href="data.html"
                        class="bg-pink-500 hover:bg-pink-600 text-white border-none rounded py-2.5 px-6 text-sm font-medium cursor-pointern o-underline">
                        Lihat
                        Data
                    </a>
                </div>
                <button type="reset"
                    class="bg-none border-none text-pink-500 py-2.5 px-4 text-sm ml-auto font-medium cursor-pointer rounded hover:bg-pink-100 transition-colors duration-200">Reset</button>
            </div>
        </form>

        <footer class="w-full max-w-[640px] mt-6 flex flex-col items-center gap-2 pb-6">
            <p class="text-xs text-gray-500 text-center class=leading-relaxed">
                This content is neither created nor
                endorsed by Google.
            </p>
            <div class="flex items-center gap-1.5 text-xs">
                <a href="#" class="text-gray-500 underline cursor-pointer hover:text-gray-900">
                    Report Abuse
                </a>
                <span class="text-gray-500">-</span>
                <a href="#" class="text-gray-500 underline cursor-pointer hover:text-gray-900">
                    Terms of Service
                </a>
                <span class="text-gray-500">-</span>
                <a href="#" class="text-gray-500 underline cursor-pointer hover:text-gray-900">
                    Privacy Policy
                </a>
            </div>
            <div class="mt-4 font-sans text-[18px] text-gray-500 flex items-center gap-0.5 select-none">
                <span class="font-bold tracking-tight">Google</span>
                <span class="font-normal">Forms</span>
            </div>
        </footer>
    </main>

    <script>
        $(function () {
            const form = $('#form');

            form.on('submit', function (e) {
                e.preventDefault();

                const dataForm = new FormData(e.target)
                const valueForm = Object.fromEntries(dataForm.entries())
                valueForm.merkSmoke = [];
                $('input[name="merkSmoke"]:checked').each(function () {
                    valueForm.merkSmoke.push($(this).val());
                });
                
                
                // validasi form
                if (valueForm.gender === "" || valueForm.smoke === "") {
                    alert('Mohon isi jenis Kelamin, dan status apakah perokok atau tidak');
                    return;
                }

                if (valueForm.smoke === "Ya" && valueForm.merkSmoke.length === 0) {
                    alert('Mohon isi merk rokok, jika anda perokok');
                    return;
                }

                if (valueForm.smoke === "Tidak" && valueForm.merkSmoke.length !== 0) {
                    alert('Jika anda bukan perokok, tidak perlu isi merk rokok');
                    return;
                }
                // tampung input ke dalam variabel
                const responseData = {
                    name: valueForm.name,
                    age: valueForm.age,
                    gender: valueForm.gender,
                    smoke: valueForm.smoke,
                    merkSmoke: valueForm.merkSmoke.join(', ')
                };
                // ambil data di local storage, kalo tidak ada beri array kosong
                const existingData = JSON.parse(window.localStorage.getItem('surveyResponses')) || [];
                //tambahkan data input ke variabel yang digunakan untuk ambil data local storage
                existingData.push(responseData);
                // simpan ke local storage dalam bentuk string
                window.localStorage.setItem('surveyResponses', JSON.stringify(existingData));
                
                window.location.href = 'data.html';
            });
        });
    </script>
</body>


</html>
