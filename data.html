<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Data Survey </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Tabel Survey Perokok</h1>
    <table border="1">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Umur</th>
                <th>Jenis Kelamin</th>
                <th>Perokok</th>
                <th>Merk Rokok</th>
            </tr>
        </thead>
        <tbody class="tbody">

        </tbody>
    </table>
    <a href="index.html" class="btn-back">Kembali ke Form</a>
    <button id="clear-btn" class="btn-clear">Hapus Semua Data</button>

    <script>
        const tableBody = document.querySelector('.tbody')
        const clearBtn = document.getElementById('clear-btn')

        function displayData() {

            const savedData = JSON.parse(window.localStorage.getItem('surveyResponses')) || []

            savedData.forEach((data, index) => {
                const row = document.createElement('tr')

                const columnsData = [
                    index + 1,
                    data.name,
                    data.age,
                    data.gender || '-',
                    data.smoke || '-',
                    data.merkSmoke || '-'
                ];

                columnsData.forEach(text => {
                    const cell = document.createElement('td');
                    cell.innerText = text;
                    row.append(cell);
                });

                tableBody.append(row);
            });
        }

        clearBtn.addEventListener('click', function () {
            if (confirm('Apakah Anda yakin ingin menghapus semua data survey?')) {
                window.localStorage.removeItem('surveyResponses')
                window.location.href = 'data.html'
            }
        });

        displayData()
    </script>
</body>

</html>
