<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Data Survey </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Tabel Survey Perokok</h1>
    <table border="1">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Umur</th>
                <th>Jenis Kelamin</th>
                <th>Perokok</th>
                <th>Merk Rokok</th>
            </tr>
        </thead>
        <tbody class="tbody">

        </tbody>
    </table>
    <a href="index.html" class="btn-back">Kembali ke Form</a>
    <button id="clear-btn" class="btn-clear">Hapus Semua Data</button>

    <script>
        const tableBody = document.querySelector('.tbody')
        const clearBtn = document.getElementById('clear-btn')

        function displayData() {

            const savedData = JSON.parse(window.localStorage.getItem('surveyResponses')) || []

            savedData.forEach((data, index) => {
                const row = document.createElement('tr')
                const col1 = document.createElement('td')
                col1.innerText = index + 1
                const col2 = document.createElement('td')
                col2.innerText = data.name
                const col3 = document.createElement('td')
                col3.innerText = data.age
                const col4 = document.createElement('td')
                col4.innerText = data.gender
                const col5 = document.createElement('td')
                col5.innerText = data.smoke
                const col6 = document.createElement('td')
                col6.innerText = data.merkSmoke

                row.append(col1, col2, col3, col4, col5, col6)
                tableBody.append(row)
                
            });
        }

        clearBtn.addEventListener('click', function () {
            if (confirm('Apakah Anda yakin ingin menghapus semua data survey?')) {
                window.localStorage.removeItem('surveyResponses')
                window.location.href = 'data.html'
            }
        });

        displayData()
    </script>
</body>

</html>
